version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Astro requires Node 22.12 or newer; the default build image is older.
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
